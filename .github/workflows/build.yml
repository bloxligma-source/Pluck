name: Build Pluck
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
      - name: Build APK
        run: |
          rm -rf android www
          mkdir -p www
          cp index.html www/index.html
          mkdir -p android/app/src/main/java/com/pluck/app
          mkdir -p android/app/src/main/assets/www
          mkdir -p android/app/src/main/res/drawable
          cp www/index.html android/app/src/main/assets/www/
          if [ -f pluck_p_black_512x512.png ]; then
            echo "Using your logo"
            cp pluck_p_black_512x512.png android/app/src/main/res/drawable/icon.png
          else
            echo "Logo not found"
            exit 1
          fi
          cat > android/settings.gradle << 'EOF'
          include ':app'
          EOF
          cat > android/build.gradle << 'EOF'
          buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.1.4' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          cat > android/gradle.properties << 'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF
          cat > android/app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.pluck.app'
            compileSdk 34
            defaultConfig {
              applicationId "com.pluck.app"
              minSdk 21
              targetSdk 34
              versionCode 3
              versionName "1.2"
            }
            buildTypes {
              release { minifyEnabled false }
              debug { minifyEnabled false }
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          dependencies {}
          EOF
          cat > android/app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:allowBackup="true" android:icon="@drawable/icon" android:label="Pluck">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > android/app/src/main/java/com/pluck/app/MainActivity.java << 'EOF'
          package com.pluck.app;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          public class MainActivity extends Activity {
            protected void onCreate(Bundle b) {
              super.onCreate(b);
              WebView w = new WebView(this);
              w.getSettings().setJavaScriptEnabled(true);
              w.getSettings().setDomStorageEnabled(true);
              w.getSettings().setAllowFileAccess(true);
              w.loadUrl("file:///android_asset/www/index.html");
              setContentView(w);
            }
          }
          EOF
          cd android
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Pluck-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
