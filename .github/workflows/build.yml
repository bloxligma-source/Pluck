name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5

      - name: Debug - list files
        run: |
          pwd
          ls -la
          echo "--- find gradle files ---"
          find . -maxdepth 4 -name "*.gradle" -o -name "gradlew" | head -n 20

      - name: Build Release APK
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          GRADLEW=$(find . -name gradlew -type f | head -n 1)
          if [ -n "$GRADLEW" ]; then
            echo "Found wrapper at $GRADLEW"
            chmod +x $GRADLEW
            $GRADLEW assembleRelease --no-daemon
          else
            echo "No wrapper, using system gradle"
            gradle assembleRelease --no-daemon
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pluck-APK
          path: "**/build/outputs/apk/release/*.apk"
